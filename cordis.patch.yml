# dsh-desktop-shortcut bundle patch
#
# `dsh.bundle.patch` layer of the published npm package. When installed via
#
#   dsh plugin --profile <name> add dsh-desktop-shortcut
#
# the CLI reconciles installed packages against this declaration and appends
# the plugin to the profile bundle stack; the profile boot then merges THIS
# patch (a single `insert` of the plugin row) exactly like a manual
# cordis.patch.yml mount line. No profile file edits needed.
- insert:
    - id: desktop-shortcut
      name: 'dsh-desktop-shortcut'
